<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="glowSpot1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowSpot2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for foreground text -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .dynamic-pulse {
        animation: pulseEffect 4s ease-in-out infinite alternate;
      }
      .dynamic-wave {
        animation: waveShift 12s linear infinite alternate;
      }
      .dynamic-scan {
        animation: radarSweep 8s linear infinite;
        transform-origin: 850px 160px;
      }
      .node-pulse {
        animation: nodeGlow 3s ease-in-out infinite alternate;
      }
      @keyframes pulseEffect {
        0% { opacity: 0.2; transform: scale(0.98); }
        100% { opacity: 0.6; transform: scale(1.02); }
      }
      @keyframes waveShift {
        0% { transform: translateY(0px) scaleY(1); }
        50% { transform: translateY(-8px) scaleY(1.05); }
        100% { transform: translateY(5px) scaleY(0.95); }
      }
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes nodeGlow {
        0% { r: 3.5px; opacity: 0.5; }
        100% { r: 6px; opacity: 1; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 17px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        fill: #34d399;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1000" height="320" rx="16" fill="url(#glowSpot1)" />
  <rect width="1000" height="320" rx="16" fill="url(#glowSpot2)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Kept strictly subtle and behind text) -->
  <g class="dynamic-wave" opacity="0.35">
    <!-- Topographic contour curves -->
    <path d="M-50,220 C150,160 300,260 500,200 C700,140 850,230 1050,180" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,6" />
    <path d="M-50,250 C180,210 320,280 550,230 C750,180 880,260 1050,220" fill="none" stroke="#06b6d4" stroke-width="1.2" />
    <path d="M-50,280 C200,240 380,310 600,260 C780,210 920,280 1050,250" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="2,4" />
  </g>

  <!-- Dynamic Cadastral Grid Nodes (Subtle Background) -->
  <g opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="320" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" />
    <line x1="250" y1="0" x2="250" y2="320" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" />
    <line x1="400" y1="0" x2="400" y2="320" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" />
    <line x1="550" y1="0" x2="550" y2="320" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" />
    <line x1="700" y1="0" x2="700" y2="320" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" />
    <line x1="850" y1="0" x2="850" y2="320" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" />

    <line x1="0" y1="80" x2="1000" y2="80" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" />
    <line x1="0" y1="160" x2="1000" y2="160" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" />
    <line x1="0" y1="240" x2="1000" y2="240" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3" />
  </g>

  <!-- Geospatial Parcel Polygon Wireframes (Right Side Accents) -->
  <g opacity="0.35" transform="translate(100, 0)">
    <polygon points="720,70 780,40 840,90 810,140 730,120" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="1.5" />
    <polygon points="840,90 910,60 950,110 920,160 810,140" fill="rgba(6, 182, 212, 0.08)" stroke="#06b6d4" stroke-width="1.5" />
    <polygon points="730,120 810,140 800,210 710,190" fill="rgba(59, 130, 246, 0.08)" stroke="#3b82f6" stroke-width="1.5" />
    <polygon points="810,140 920,160 900,230 800,210" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="1.5" />

    <!-- Pulsing GIS Anchor Nodes -->
    <circle cx="780" cy="40" r="4" fill="#34d399" class="node-pulse" filter="url(#glowFilter)" />
    <circle cx="840" cy="90" r="4" fill="#38bdf8" class="node-pulse" filter="url(#glowFilter)" />
    <circle cx="810" cy="140" r="5" fill="#10b981" class="node-pulse" filter="url(#glowFilter)" />
    <circle cx="920" cy="160" r="4" fill="#06b6d4" class="node-pulse" filter="url(#glowFilter)" />
    <circle cx="800" cy="210" r="4" fill="#3b82f6" class="node-pulse" filter="url(#glowFilter)" />
  </g>

  <!-- Border Frame -->
  <rect x="1.5" y="1.5" width="997" height="317" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- FOREGROUND CONTENT LAYER (High Contrast & Clear Visibility) -->
  <g transform="translate(60, 50)">
    <!-- Pill Badge -->
    <g transform="translate(0, 10)">
      <rect width="195" height="26" rx="13" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#10b981" />
      <text x="26" y="17" class="pill-text">GOVTECH &amp; CIVIC GIS</text>
    </g>

    <!-- Main Title with high contrast drop shadow -->
    <g transform="translate(0, 80)" filter="url(#shadow)">
      <text class="title-text">
        Awesome <tspan fill="url(#cyanEmerald)">Land Management</tspan>
      </text>
    </g>

    <!-- Subtitle Line 1 -->
    <g transform="translate(0, 122)" filter="url(#shadow)">
      <text class="subtitle-text">
        Curated ecosystem of SaaS platforms &amp; open-source projects for local government.
      </text>
    </g>

    <!-- Subtitle Line 2 / Feature highlights -->
    <g transform="translate(0, 150)" filter="url(#shadow)">
      <text class="subtitle-text" font-size="14px" fill="#64748b">
        Permitting &#x2022; Zoning Analysis &#x2022; Cadastre &#x2022; Inspections &#x2022; Urban Planning &#x2022; Code Enforcement
      </text>
    </g>

    <!-- Category Highlight Pills -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="130" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11px" fill="#cbd5e1">&#x1F3DB;&#xFE0F; Enterprise SaaS</text>

      <rect x="140" y="0" width="145" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="212" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11px" fill="#cbd5e1">&#x1F4BB; Open-Source Stacks</text>

      <rect x="295" y="0" width="125" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="357" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11px" fill="#cbd5e1">&#x1F5FA;&#xFE0F; GIS &amp; Cadastre</text>
    </g>
  </g>
</svg>
